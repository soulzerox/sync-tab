<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>SyncTab — Group Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup" id="popup">
    <header>
      <div class="brand-row">
        <h1>Group Sync</h1>
        <div class="stats" id="stats">
          <span class="stat"><b id="stat-groups">0</b> กลุ่ม</span>
          <span class="stat"><b id="stat-tabs">0</b> แท็บ</span>
          <span class="stat"><b id="stat-awake">0</b> ตื่น</span>
          <button class="theme-toggle" id="theme-toggle" aria-label="สลับธีมสว่าง/มืด" title="สลับธีม">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="theme-icon"></svg>
          </button>
        </div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="ค้นหากลุ่มหรือแท็บ…" aria-label="ค้นหากลุ่มหรือแท็บ" />
      </div>
    </header>

    <main class="list" id="list" aria-live="polite"></main>

    <footer>
      <span class="syncline"><span class="okdot"></span><span id="sync-time">ยังไม่สแกน</span></span>
      <span class="hint">แท็บนอกกลุ่มไม่ถูกจับ</span>
    </footer>
  </div>

  <div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
